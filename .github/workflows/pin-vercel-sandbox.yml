name: pin-vercel-sandbox
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ugc-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/funny-babbage-8vdqso

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ugc-app/pnpm-lock.yaml

      - name: Pin @vercel/sandbox to 1.6.0
        run: |
          sed -i 's|"@vercel/sandbox": "\^2\.2\.1"|"@vercel/sandbox": "1.6.0"|' package.json
          grep -F '"@vercel/sandbox": "1.6.0"' package.json

      - name: Install (regenerate lockfile)
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build (best effort)
        run: pnpm build
        continue-on-error: true

      - name: Commit and push pin + lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "fix: pin @vercel/sandbox to 1.6.0 for @remotion/vercel compatibility"
          git push origin HEAD:claude/funny-babbage-8vdqso
